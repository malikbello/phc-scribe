# Assertion cues. `pre` cues must sit in the same clause before the term (and after
# the last comma); `post` cues right after it. Historical cues apply anywhere in the
# clause. Priority: negation > historical > hedge > present.
cues:
  negation:
    pre: ["no", not, denies, denied, without, never, nil, negative for, free of, does not have,
          doesn't have, did not have, didn't have, has not had, hasn't had, kò, kò sí, kìí]
    post: [nil, none, absent, denied, negative, "no", rárá, kò sí]
  hedge:
    pre: [maybe, possibly, possible, might, may be, may have, not sure, query, suspected, suspect,
          likely, bóyá]
    post: [maybe, possibly]
  historical:
    any: [last pregnancy, previous pregnancy, past pregnancy, previous pregnancies, history of,
          h/o, in the past, years ago, last year, oyún tó kọjá, oyún àkọ́kọ́, nígbà kan rí]
  answer_yes: ["yes", yeah, "yes o", bẹ́ẹ̀ni, bẹ́ẹ̀ ni]
  answer_no: ["no", "no o", none, nil, rárá, kò sí]
  clause_breaks: [but, however, although, though, ṣùgbọ́n, sugbon]


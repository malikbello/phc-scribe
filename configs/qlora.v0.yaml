# QLoRA fine-tune of base N-ATLaS (docs/architecture.md, section 6). One file per run;
# the trainer copies it next to the adapter so every result can be traced to its config.
run_name: natlas-qlora-v0
model: NCAIR1/N-ATLaS
revision: null          # pin to a commit before the first real run
load_in_4bit: true
train_file: data/train/sft.v0.jsonl
max_seq_len: 1536
seed: 20261003
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 2
  learning_rate: 1.0e-4   # proposal A: best value for Llama-3.1-8B LoRA extraction (docs/research/finetuning-review.md §2.2)
  batch_size: 1
  grad_accum: 16
  warmup_ratio: 0.03
  lr_scheduler: cosine
  logging_steps: 10
  gradient_checkpointing: true

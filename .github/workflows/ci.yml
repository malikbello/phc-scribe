name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install (pinned, hash-checked)
        run: |
          pip install --require-hashes -r requirements/ci.lock
          pip install --no-deps -e .
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: pyright
      - name: Generated files are up to date
        run: |
          python scripts/export_schema.py --check
          python scripts/export_review_data.py --check
          python scripts/export_openapi.py --check
      - name: Tests (unit, rules golden tests, smoke-eval)
        run: pytest

  review-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: review-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: review-app/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements/ci.lock
